[project]
name = "audiocall"
version = "0.1.0"
description = "Voice agent powered by Twilio and Google ADK (Gemini Live API)"
requires-python = ">=3.13"
dependencies = [
    "google-adk>=1.27.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "twilio>=9.0.0",
    "audioop-lts>=0.2.1; python_version>='3.13'",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "bcrypt>=4.1.0",
    "openai>=1.50.0",
    "cryptography>=42",
    "httpx>=0.28.1",
]

[project.scripts]
audiocall = "audiocall.main:main"

[tool.setuptools.packages.find]
# `backend/alembic/` sits alongside `audiocall/` for migration tooling — it is
# not an installable package, so restrict discovery to `audiocall` and its
# subpackages (audiocall.db, audiocall.services, audiocall.api, audiocall.core)
# rather than picking up `alembic` as a second top-level package.
include = ["audiocall*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
